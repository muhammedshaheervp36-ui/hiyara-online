<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiyara Admin - Sign In</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0f1115;
            --card-bg: #181b22;
            --accent-gold: #c5a059;
            --accent-gold-hover: #b08c46;
            --text-main: #f5f5f5;
            --text-muted: #8e95a5;
            --border-color: #2a2f3a;
            --error-bg: #2d181a;
            --error-border: #7f1d1d;
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(197, 160, 89, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(197, 160, 89, 0.05) 0%, transparent 40%);
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .error-alert {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: #111318;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-gold-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .demo-credentials {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .demo-credentials code {
            color: var(--accent-gold);
            background: rgba(197, 160, 89, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo">Hiyara</div>
            <div class="brand-subtitle">Administrator Portal</div>
        </div>

        <div id="login-error" class="error-alert"></div>

        <form id="login-form" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="admin-email">Admin Email</label>
                <input type="email" id="admin-email" class="form-control" placeholder="admin@hiyara.com" required>
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <button type="submit" id="btn-login" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <div class="demo-credentials">Use the account created with <code>npm run setup-admin</code>.</div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!email || !password) {
                errorDiv.textContent = 'Please enter both email and password.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    errorDiv.textContent = data.error || 'Authentication failed. Invalid email or password.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In to Dashboard';
                    return;
                }

                // Authentication succeeded! Redirect to admin dashboard
                window.location.href = 'admin.html';
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.textContent = 'Unable to connect to authentication server. Please check your network connection.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In to Dashboard';
            }
        }

        // Check if already authenticated
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        window.location.href = 'admin.html';
                    }
                }
            } catch (e) {}
        });
    </script>
</body>

</html>
